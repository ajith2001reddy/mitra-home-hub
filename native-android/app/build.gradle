plugins {
  id 'com.android.application'
}

def mitraApplicationId = providers.gradleProperty('mitraApplicationId').orElse('com.mitrahome.hub').get()
def mitraKeystorePath = providers.gradleProperty('mitraKeystorePath').orNull
def mitraKeyAlias = providers.environmentVariable('MITRA_KEY_ALIAS').orNull
def mitraKeystorePassword = providers.environmentVariable('MITRA_KEYSTORE_PASSWORD').orNull
def useLocalSigning = mitraKeystorePath != null && mitraKeyAlias != null && mitraKeystorePassword != null

android {
  namespace 'com.mitrahome.hub'
  compileSdk 35

  defaultConfig {
    applicationId mitraApplicationId
    minSdk 26
    targetSdk 35
    versionCode 26
    versionName '3.5'
  }

  if (useLocalSigning) {
    signingConfigs {
      localUpdate {
        storeFile file(mitraKeystorePath)
        storePassword mitraKeystorePassword
        keyAlias mitraKeyAlias
        keyPassword mitraKeystorePassword
      }
    }
  }

  buildTypes {
    debug {
      if (useLocalSigning) signingConfig signingConfigs.localUpdate
    }
    release {
      signingConfig useLocalSigning ? signingConfigs.localUpdate : signingConfigs.debug
      minifyEnabled false
    }
  }

  sourceSets {
    main {
      manifest.srcFile '../AndroidManifest.xml'
      java.srcDirs = ['../src']
      res.srcDirs = ['../res']
      assets.srcDirs = ["${rootProject.projectDir}/build/assets"]
    }
  }
}

tasks.register('syncWebAssets', Copy) {
  from "${rootProject.projectDir.parentFile}/dist"
  into "${rootProject.projectDir}/build/assets/www"
}
tasks.named('preBuild').configure { dependsOn(tasks.named('syncWebAssets')) }

dependencies {
  implementation 'com.google.android.gms:play-services-auth:21.3.0'
}
